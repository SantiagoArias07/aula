<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aula — Regulariza tus matemáticas con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Light palette — warm off-white, deep ink, violet primary, green accent */
    --bg: #fafaf7;
    --bg-2: #f1f0eb;
    --surface: #ffffff;
    --surface-2: #f6f5f0;
    --ink: #14141a;
    --ink-2: #3a3a45;
    --muted: #6b6b78;
    --faint: #a5a5af;
    --line: #e8e7e0;
    --line-2: #d8d7d0;
    --primary: #5b3fdb;
    --primary-soft: #ece8fc;
    --primary-ink: #2a1c8a;
    --accent: #1f8f5b;
    --accent-soft: #d8efe0;
    --warn: #c47a1e;
    --warn-soft: #f7e9cf;
    --danger: #b8442e;
    --danger-soft: #f6dcd2;

    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 22px;
    --shadow: 0 1px 0 rgba(20,20,26,.04), 0 10px 30px -18px rgba(20,20,26,.18);

    --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-serif: "Fraunces", Georgia, serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
  }

  /* Dark palette — same hues, lifted lightness */
  [data-theme="dark"] {
    --bg: #0e0e14;
    --bg-2: #15151c;
    --surface: #17171f;
    --surface-2: #1d1d26;
    --ink: #f3f2ec;
    --ink-2: #cfcec6;
    --muted: #8a8a96;
    --faint: #56565f;
    --line: #25252e;
    --line-2: #32323c;
    --primary: #9d83ff;
    --primary-soft: #2a2057;
    --primary-ink: #d3c5ff;
    --accent: #5ee0a3;
    --accent-soft: #143726;
    --warn: #e8b266;
    --warn-soft: #3b2c14;
    --danger: #e08a73;
    --danger-soft: #3b1f17;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 14px 40px -20px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; font-feature-settings: "ss01", "cv11"; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; }

  ::selection { background: var(--primary); color: white; }

  /* Type scale */
  .display { font-family: var(--font-serif); font-weight: 300; font-optical-sizing: auto; letter-spacing: -0.015em; line-height: 1.05; }
  .serif-italic { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-optical-sizing: auto; }
  .mono { font-family: var(--font-mono); font-feature-settings: "ss02"; }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

  /* App shell */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .main { flex: 1; padding: 28px 40px 80px; max-width: 1400px; width: 100%; margin: 0 auto; }
  @media (max-width: 880px) { .main { padding: 16px 16px 100px; } }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; gap: 28px; }
  @media (max-width: 880px) { .topbar-inner { padding: 12px 16px; gap: 10px; } }

  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-serif); font-size: 22px; font-weight: 400; font-optical-sizing: auto; letter-spacing: -0.02em; }
  .brand-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); position: relative; }
  .brand-dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg); }

  .nav { display: flex; gap: 2px; align-items: center; }
  .nav-link { position: relative; padding: 8px 12px; border-radius: 10px; color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: default; transition: background .15s, color .15s; display: flex; align-items: center; gap: 8px; }
  .nav-link:hover { background: var(--surface-2); color: var(--ink); }
  .nav-link[aria-current="page"] { color: var(--ink); }
  .nav-link[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -15px; height: 2px; background: var(--ink); border-radius: 2px; }
  .nav-link .badge { background: var(--primary); color: white; font-size: 10px; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); }

  .nav-spacer { flex: 1; }

  .icon-btn { width: 36px; height: 36px; border-radius: 10px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; cursor: default; color: var(--ink-2); position: relative; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg); }

  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #c9bcff, #5b3fdb); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }

  /* Search */
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid transparent; padding: 7px 12px; border-radius: 10px; width: 260px; color: var(--muted); font-size: 13px; cursor: default; }
  .search:hover { border-color: var(--line); }
  .search .kbd { margin-left: auto; font-family: var(--font-mono); font-size: 10px; padding: 2px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
  @media (max-width: 1100px) { .search { width: 180px; } .search .kbd { display: none; } }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .card-lg { padding: 28px; border-radius: var(--radius-lg); }
  .card-flush { padding: 0; overflow: hidden; }

  /* Pills / tags */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1; height: 24px; }
  .pill-ghost { background: var(--surface-2); color: var(--ink-2); }
  .pill-primary { background: var(--primary-soft); color: var(--primary-ink); }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-danger { background: var(--danger-soft); color: var(--danger); }
  .pill-outline { background: transparent; color: var(--ink-2); border: 1px solid var(--line-2); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid transparent; cursor: default; transition: background .15s, border-color .15s, transform .05s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-primary:hover { background: color-mix(in oklab, var(--ink), white 8%); }
  [data-theme="dark"] .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-violet { background: var(--primary); color: white; }
  .btn-violet:hover { background: color-mix(in oklab, var(--primary), black 10%); }

  /* Stripey placeholder pattern (for imagery) */
  .placeholder {
    background-image: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--bg-2) 8px 16px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  }

  /* Grid helpers */
  .row { display: flex; }
  .grid { display: grid; }
  .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; } .gap-6 { gap: 24px; } .gap-8 { gap: 32px; }

  /* Focus ring */
  *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

  /* View transitions */
  .view { animation: fade .26s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Course color swatches (subtle, editorial) */
  .course-mat { background: linear-gradient(135deg, #f3eada, #e9d8b3); }
  .course-his { background: linear-gradient(135deg, #e6e1f5, #c9bdf0); }
  .course-bio { background: linear-gradient(135deg, #dde9d9, #b9d4b1); }
  .course-quim { background: linear-gradient(135deg, #f4dfde, #e8b9b5); }
  .course-let { background: linear-gradient(135deg, #e6e6e6, #cfcfcf); }
  .course-fis { background: linear-gradient(135deg, #dde5ee, #b9c8db); }
  [data-theme="dark"] .course-mat { background: linear-gradient(135deg, #3a3220, #5c4f2f); color: #f3eada; }
  [data-theme="dark"] .course-his { background: linear-gradient(135deg, #2a2347, #443573); color: #e6e1f5; }
  [data-theme="dark"] .course-bio { background: linear-gradient(135deg, #1f2e22, #2f4e36); color: #dde9d9; }
  [data-theme="dark"] .course-quim { background: linear-gradient(135deg, #3a2120, #5e3431); color: #f4dfde; }
  [data-theme="dark"] .course-let { background: linear-gradient(135deg, #2a2a2a, #444); color: #e6e6e6; }
  [data-theme="dark"] .course-fis { background: linear-gradient(135deg, #1f2934, #344861); color: #dde5ee; }

  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Divider */
  .hr { height: 1px; background: var(--line); border: 0; margin: 0; }
  .vr { width: 1px; background: var(--line); align-self: stretch; }

  /* Helpers */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skel { background: linear-gradient(90deg, var(--surface-2), var(--bg-2), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; border-radius: 6px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ── Responsive (mobile-first, funcional desde 360px) ─────────────── */
  .show-sm { display: none; }
  @media (max-width: 880px) {
    /* Layout: cualquier grid con .stack-sm colapsa a una columna */
    .stack-sm { grid-template-columns: 1fr !important; }
    /* En móvil la navegación vive en la barra inferior; el topbar se aligera */
    .topbar .nav, .topbar .search, .topbar .nav-ayuda { display: none !important; }
    .hide-sm { display: none !important; }
    .show-sm { display: inline-flex !important; }
    .h-auto-sm { height: auto !important; min-height: 0 !important; }
    /* Los "hero" con estadísticas al lado envuelven en lugar de desbordar */
    .hero-wrap-sm { flex-direction: column; align-items: flex-start !important; gap: 20px !important; }
  }

  /* ── Command palette (⌘K) ─────────────────────────────────────────── */
  .cmdk-backdrop { position: fixed; inset: 0; z-index: 100; background: color-mix(in oklab, var(--ink) 32%, transparent); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; animation: fade .16s ease both; }
  @media (max-width: 880px) { .cmdk-backdrop { padding: 8vh 12px 12px; } }
  .cmdk { width: 100%; max-width: 600px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 72vh; }
  .cmdk-top { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .cmdk-input { flex: 1; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 17px; color: var(--ink); }
  .cmdk-input::placeholder { color: var(--faint); }
  .cmdk-list { overflow-y: auto; padding: 8px; }
  .cmdk-group { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 12px 12px 6px; }
  .cmdk-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; cursor: default; }
  .cmdk-item[data-active="1"] { background: var(--surface-2); }
  .cmdk-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface-2); color: var(--ink-2); }
  .cmdk-empty { padding: 44px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .cmdk-foot { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .cmdk-kbd { font-family: var(--font-mono); font-size: 10px; padding: 2px 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }

  /* ── Offline banner ───────────────────────────────────────────────── */
  .offline-banner { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 16px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 500; text-align: center; }
  @media (max-width: 880px) { .offline-banner { font-size: 11.5px; padding: 7px 12px; } }

  /* ── Matemáticas · práctica ───────────────────────────────────────── */
  .mathq { font-family: var(--font-mono); font-feature-settings: "ss02"; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: -0.38em; line-height: 1; margin: 0 3px; font-size: 0.88em; }
  .frac > span:first-child { padding: 0 5px 2px; border-bottom: 1.6px solid currentColor; }
  .frac > span:last-child { padding: 2px 5px 0; }

  /* Opciones de respuesta */
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 15px 18px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); cursor: default; transition: border-color .15s, background .15s, transform .05s; font-size: 16px; color: var(--ink); }
  .opt:hover { border-color: var(--faint); }
  .opt:active { transform: translateY(1px); }
  .opt[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft); }
  .opt[data-state="correct"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[data-state="wrong"] { border-color: var(--danger); background: var(--danger-soft); }
  .opt[data-state="muted"] { opacity: .45; }
  .opt-key { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 13px; flex-shrink: 0; color: var(--ink-2); }
  .opt[data-state="selected"] .opt-key { background: var(--primary); color: #fff; }
  .opt[data-state="correct"] .opt-key { background: var(--accent); color: #fff; }
  .opt[data-state="wrong"] .opt-key { background: var(--danger); color: #fff; }

  /* Entrada numérica */
  .numin { width: 100%; padding: 16px 18px; font-family: var(--font-mono); font-size: 24px; text-align: center; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 14px; color: var(--ink); outline: none; }
  .numin:focus { border-color: var(--primary); }
  .numin::placeholder { color: var(--faint); }

  /* Selector de etapa (chips) */
  .chip-etapa { padding: 8px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 500; border: 1px solid var(--line-2); background: var(--surface); cursor: default; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
  .chip-etapa:hover { border-color: var(--faint); }
  .chip-etapa[data-on="1"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Sugerencias del tutor / heatmap de racha */
  .suger { padding: 8px 14px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line-2); background: var(--surface); cursor: default; white-space: nowrap; color: var(--ink-2); transition: background .15s, border-color .15s; }
  .suger:hover { background: var(--surface-2); border-color: var(--faint); }
  .heat { border-radius: 4px; background: var(--surface-2); }

  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .28s cubic-bezier(.3,.7,.4,1.3) both; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px var(--primary-soft); } 50% { box-shadow: 0 0 0 9px transparent; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
