spring:
  application:
    name: aula-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aula}
    username: ${DB_USER:aula}
    password: ${DB_PASSWORD:aula}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-real-secret-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    local-path: ${STORAGE_PATH:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
